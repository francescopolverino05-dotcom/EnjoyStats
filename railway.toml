# Railway config for the **Web** service.
# On the Worker service, override in the Railway UI:
#   Dockerfile path = Dockerfile.worker
#   Start command   = python -m analytics.collect_worker
# Do NOT leave Worker on this file's Dockerfile.dashboard default.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
startCommand = "streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true --server.maxUploadSize=5120 --server.maxMessageSize=5120 --browser.gatherUsageStats=false"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
