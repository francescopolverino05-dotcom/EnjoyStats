# Railway config for the **Web** service only.
# Worker must use a different Config-as-code file:
#   Settings → Config-as-code → railway.worker.toml
#
# Generate Service Domain port: 8501
# (must match the container listen port / $PORT)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
startCommand = "/app/scripts/statman_web_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 120
