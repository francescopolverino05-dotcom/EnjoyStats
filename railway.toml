# Railway config for the **Web** service.
# On the Worker service, override in the Railway UI:
#   Dockerfile path = Dockerfile.worker
#   Config-as-code  = railway.worker.toml
# Do NOT leave Worker on this file's Dockerfile.dashboard default.
#
# Generate Service Domain port: 8501
# (or leave Railway's $PORT — the entrypoint listens on $PORT)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
startCommand = "/app/scripts/statman_web_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
