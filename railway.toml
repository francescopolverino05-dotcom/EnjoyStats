# Railway config for the **Web** service only.
# Worker → Settings → Config-as-code → railway.worker.toml
#
# Set Web → Variables → PORT=8501
# Set Networking domain target port = 8501 (same number).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
startCommand = "/bin/sh /app/scripts/statman_web_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 120
