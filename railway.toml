# Railway config for the **Web** service only.
# Worker → Settings → Config-as-code → railway.worker.toml
#
# CRITICAL: Networking domain target port must equal the PORT variable.
# Set Web → Variables → PORT=8501 and domain target port 8501 (same number).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
# Shell form so $PORT expands if Railway substitutes the start command.
startCommand = "/bin/sh /app/scripts/statman_web_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 300
