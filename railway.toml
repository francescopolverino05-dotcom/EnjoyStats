# Web service only. Worker → railway.worker.toml
#
# Domain target port must match Railway PORT (currently 8080 for statman.up.railway.app).
# Film upload uses same-origin chunked API via the portal (not Streamlit axios).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.dashboard"

[deploy]
# Empty Custom Start Command in the Railway UI is fine — this startCommand runs.
startCommand = "/bin/sh /app/scripts/statman_web_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# Portal-local readiness (does not wait on Streamlit).
healthcheckPath = "/readyz"
healthcheckTimeout = 300
