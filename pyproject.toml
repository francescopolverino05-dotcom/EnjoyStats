[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enjoystats"
version = "0.1.0"
description = "Real-time and post-match football event tagging and player stats collection."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EnjoyStats" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "asyncpg>=0.29,<1",
    "httpx>=0.27,<1",
    "streamlit>=1.36,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
]

[project.scripts]
enjoystats = "api.main:run"

[tool.setuptools.packages.find]
include = ["config*", "data_models*", "analytics*", "storage*", "api*", "app*"]

[tool.setuptools.package-data]
config = ["py.typed"]
data_models = ["py.typed"]
analytics = ["py.typed"]
storage = ["py.typed", "postgres_tables.sql"]
api = ["py.typed"]
app = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
