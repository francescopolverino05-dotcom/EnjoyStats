# Railway config for the **Worker** service only.
# In Railway → Worker → Settings → Config-as-code, set the file to:
#   railway.worker.toml
# If this is left on railway.toml, Worker builds the Web image and fails.
#
# Worker: no public domain / no healthcheck path.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "/bin/sh /app/scripts/statman_worker_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
