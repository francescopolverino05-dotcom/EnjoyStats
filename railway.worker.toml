# Railway config for the **Worker** service.
# In Railway → Worker → Settings → Config-as-code, set config file to:
#   railway.worker.toml
# Or manually: Dockerfile = Dockerfile.worker, start = python -m analytics.collect_worker

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "/app/scripts/statman_worker_entrypoint.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
