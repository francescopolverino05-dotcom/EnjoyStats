name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Postgres schema, and 5-second match simulator
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enjoystats
          POSTGRES_PASSWORD: enjoystats
          POSTGRES_DB: enjoystats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enjoystats -d enjoystats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://enjoystats:enjoystats@localhost:5432/enjoystats
      PGPASSWORD: enjoystats
      POSTGRES_USER: enjoystats
      POSTGRES_DB: enjoystats
      ENJOYSTATS_HOST: 127.0.0.1
      ENJOYSTATS_PORT: 8000
      ENJOYSTATS_DEBUG: "false"
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install flake8 and black
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8==7.1.1 black==24.8.0

      - name: Lint with flake8 (PEP 8)
        run: python -m flake8 .

      - name: Check formatting with black
        run: python -m black --check --diff .

      - name: Install application requirements
        run: python -m pip install -r requirements.txt

      - name: Apply PostgreSQL schema blueprint
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U enjoystats -d enjoystats -v ON_ERROR_STOP=1 \
            -f storage/postgres_tables.sql

      - name: Launch FastAPI in the background
        run: |
          python -m api.main > /tmp/enjoystats-api.log 2>&1 &
          echo $! > /tmp/enjoystats-api.pid
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "FastAPI is healthy on :8000"
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI failed to become healthy"
          cat /tmp/enjoystats-api.log
          exit 1

      - name: Run 5-second match simulator against live API
        run: |
          set -o pipefail
          python tests/mock_match_simulator.py \
            --base-url http://127.0.0.1:8000 \
            --delay 0 | tee /tmp/simulator.log
          grep -q "PIPELINE VERIFIED" /tmp/simulator.log

      - name: Dump FastAPI logs on failure
        if: failure()
        run: |
          echo "----- FastAPI stdout/stderr -----"
          cat /tmp/enjoystats-api.log || true
          echo "----- Simulator output -----"
          cat /tmp/simulator.log || true
